<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardest Game Achievements List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<style>
@property --g1{syntax:'<color>';inherits:true;initial-value:#3a2f66}
@property --g2{syntax:'<color>';inherits:true;initial-value:#231c45}
@property --e1{syntax:'<color>';inherits:true;initial-value:#b9a6ff}
@property --e2{syntax:'<color>';inherits:true;initial-value:#7a5cf0}
@property --bga{syntax:'<color>';inherits:true;initial-value:#1c1633}
@property --bgb{syntax:'<color>';inherits:true;initial-value:#0e0b1a}
@property --acc{syntax:'<color>';inherits:true;initial-value:#c4b5fd}
:root{color-scheme:dark;--bg:#0f1417;--card:#172026;--line:#26343c;--tx:#eef3f4;--mut:#8ea0a8;--pts:#fb923c;--chip:color-mix(in srgb,var(--acc) 16%,transparent);--box:rgba(0,0,0,.28);--bad:#f87171;--g1:#3a2f66;--g2:#231c45;--e1:#b9a6ff;--e2:#7a5cf0;--bga:#1c1633;--bgb:#0e0b1a;--acc:#c4b5fd;transition:--g1 .7s,--g2 .7s,--e1 .7s,--e2 .7s,--bga .7s,--bgb .7s,--acc .7s}
html{background:#0b0b0e}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 900px 460px at 50% -10%,color-mix(in srgb,var(--acc) 20%,transparent) 0%,transparent 62%),linear-gradient(180deg,var(--bga),var(--bgb))}
*{box-sizing:border-box}
body{margin:0;background:none;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 14px 60px}
header{text-align:center;padding:36px 48px 26px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
h1{margin:0;font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:clamp(36px,8vw,72px);line-height:.95;letter-spacing:.02em}h1 span{color:var(--acc)}
.lock{position:fixed;top:14px;right:14px;width:36px;height:36px;padding:0;border-radius:8px;font-size:18px;line-height:1;z-index:5}
.lock.on{background:var(--acc);border-color:var(--acc);color:#04201c;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.bar input{flex:1;min-width:180px;width:auto}
button{font:inherit;cursor:pointer;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#04201c;font-weight:600}
.card{display:flex;gap:14px;align-items:center;border:2px solid transparent;background:linear-gradient(135deg,var(--g1),var(--g2)) padding-box,linear-gradient(135deg,var(--e1),var(--e2)) border-box;box-shadow:0 6px 18px rgba(0,0,0,.28);border-radius:14px;padding:9px;margin-bottom:10px}
.card.drag{opacity:.4}.card.over{box-shadow:0 -3px 0 var(--acc)}
.grip{cursor:grab;color:var(--mut);font-size:18px;padding:0 2px;user-select:none}
.thumb{flex:0 0 180px;height:100px;border-radius:10px;background:linear-gradient(135deg,var(--e1),var(--e2));background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800}
.main{flex:1;min-width:0}
.title{font-size:19px;font-weight:700;overflow-wrap:anywhere}.title .rank{color:var(--acc);margin-right:8px}
.game{color:var(--mut);margin:2px 0 8px}
.info{display:inline-flex;flex-wrap:wrap;gap:4px 14px;background:var(--box);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--mut)}
.info b{color:var(--tx);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--chip);color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.act{display:flex;gap:4px}.act button{padding:3px 8px;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--tx);width:min(520px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.pick{display:flex;flex-wrap:wrap;gap:6px}.pick .tg{border-radius:99px;padding:3px 12px;font-size:13px;color:var(--mut)}.pick .tg.on{background:var(--chip);color:var(--acc);border-color:var(--acc);font-weight:600}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
input[type=file]{padding:6px}
@media(max-width:640px){.card{flex-wrap:wrap}.thumb{flex:1 0 100%;height:140px}.grip{display:none}.side{flex-direction:row;width:100%;justify-content:space-between;align-items:center}}
</style>
</head>
<body>
<button class="lock" id="lock" title="Owner sign in">✓</button>
<div class="wrap">
<header><div class="eyebrow">Achievement ranking</div><h1>HARDEST <span>GAME</span> ACHIEVEMENTS LIST</h1></header>
<div class="bar">
<input id="q" placeholder="Search by title, game, verifier, tags…">
<button class="pri" id="add" hidden>+ Add</button>
</div>
<div id="list"><div class="empty">Loading…</div></div>
</div>

<dialog id="login"><form id="lf">
<h3 style="margin:0 0 6px">Owner sign in</h3>
<label>Email</label><input id="lEmail" type="email" autocomplete="username" required>
<label>Password</label><input id="lPass" type="password" autocomplete="current-password" required>
<div class="err" id="lErr"></div>
<div class="foot"><button type="button" id="lCancel">Cancel</button><button class="pri" type="submit">Sign in</button></div>
</form></dialog>

<dialog id="dlg"><form id="f" onsubmit="return false">
<h3 id="dt" style="margin:0 0 6px">Achievement</h3>
<label>Title</label><input id="fTitle" required>
<label>Game</label><input id="fGame">
<div class="row"><div><label>Verifier</label><input id="fVer"></div><div><label>Verification date</label><input id="fDate" type="date"></div></div>
<label>Tags (click to add or remove)</label><div id="fTags" class="pick"></div>
<label>Image</label><input id="fImg" type="file" accept="image/*">
<div class="foot"><button type="button" id="cancel">Cancel</button><button class="pri" type="button" id="save">Save</button></div>
</form></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDynH2HQAF66FBVDhuVpFuNoX5jvmGpsnQ",
  authDomain: "granny-list.firebaseapp.com",
  projectId: "granny-list",
  storageBucket: "granny-list.firebasestorage.app",
  messagingSenderId: "291778496353",
  appId: "1:291778496353:web:808b2eeeaea89f235be720"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),col=db.collection("achievements");
const TAGS=["Story","Hardcore","Skill","Grind","Multi","Co-op","PvP","Speedrun"];
const $=id=>document.getElementById(id);
let items=[],admin=false,editing=null,dragFrom=null,imgData=null,selTags=new Set(),loaded=false;

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fmtDate(s){if(!s)return "";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"})}
function fail(e){alert("Could not save: "+(e&&e.message?e.message:e))}

const TIERS=[
 {max:20,g1:"#3a2f66",g2:"#231c45",e1:"#b9a6ff",e2:"#7a5cf0",bga:"#1c1633",bgb:"#0e0b1a",acc:"#c4b5fd"},
 {max:50,g1:"#4a1520",g2:"#2a0d13",e1:"#ff6b6b",e2:"#9b1c2e",bga:"#2b0f14",bgb:"#120708",acc:"#ff8a8a"},
 {max:100,g1:"#17406b",g2:"#0f2744",e1:"#5ab4ff",e2:"#2a6fdb",bga:"#0d2036",bgb:"#070f1a",acc:"#7cc4ff"},
 {max:200,g1:"#5a3d0d",g2:"#3a2508",e1:"#ffd166",e2:"#f08a24",bga:"#2e2008",bgb:"#150e04",acc:"#ffc766"},
 {max:Infinity,g1:"#4a4d52",g2:"#2a2c30",e1:"#d0d3d8",e2:"#7b7f86",bga:"#1f2124",bgb:"#0e0f10",acc:"#d5d8dc"}
];
let curTier=-1,tierTick=false;
function setTier(n){
 if(n===curTier)return;curTier=n;const t=TIERS[n],r=document.documentElement.style;
 ["g1","g2","e1","e2","bga","bgb","acc"].forEach(k=>r.setProperty("--"+k,t[k]));
}
function updateTier(){
 tierTick=false;
 const cs=document.querySelectorAll(".card");
 if(!cs.length){setTier(0);return}
 const cy=innerHeight/2;let best=null,bd=1e9;
 for(const c of cs){const r=c.getBoundingClientRect(),d=cy<r.top?r.top-cy:(cy>r.bottom?cy-r.bottom:0);if(d<bd){bd=d;best=c;if(d===0)break}}
 const rank=+best.dataset.rank;setTier(TIERS.findIndex(t=>rank<=t.max));
}
addEventListener("scroll",()=>{if(!tierTick){tierTick=true;requestAnimationFrame(updateTier)}},{passive:true});
addEventListener("resize",updateTier);
async function move(from,to){
 if(!admin||to<0||to>=items.length||from===to)return;
 items.splice(to,0,items.splice(from,1)[0]);render();
 try{const b=db.batch();items.forEach((it,i)=>{if(it.order!==i){b.update(col.doc(it.id),{order:i});it.order=i}});await b.commit()}catch(e){fail(e)}
}
function render(){
 const L=$("list"),q=$("q").value.trim().toLowerCase();L.innerHTML="";
 $("add").hidden=!admin;
 if(!loaded){L.append(el("div","empty","Loading…"));return}
 let shown=0;
 items.forEach((it,i)=>{
  const tags=(it.tags||[]).filter(t=>TAGS.includes(t));
  if(q&&![it.title,it.game,it.ver,...tags].join(" ").toLowerCase().includes(q))return;shown++;
  const c=el("div","card");c.dataset.rank=i+1;c.draggable=admin&&!q;
  const th=el("div","thumb");
  if(typeof it.img==="string"&&it.img.startsWith("data:image/"))th.style.backgroundImage="url("+it.img+")";else th.textContent=(it.title||"?")[0].toUpperCase();
  const m=el("div","main"),t=el("div","title");t.append(el("span","rank","#"+(i+1)),document.createTextNode(it.title||""));
  m.append(t,el("div","game",it.game||""));
  const inf=el("div","info");
  [["Verifier",it.ver],["Verified",fmtDate(it.date)]].forEach(([k,v])=>{if(v){const s=el("span");s.append(document.createTextNode(k+": "),el("b",null,v));inf.append(s)}});
  if(inf.children.length)m.append(inf);
  if(tags.length){const tg=el("div","tags");tags.forEach(x=>tg.append(el("span","tag",x)));m.append(tg)}
  const sd=el("div","side");
  if(admin){
   const a=el("div","act");
   [["▲",()=>move(i,i-1)],["▼",()=>move(i,i+1)],["✎",()=>openDlg(it)],["✕",async()=>{if(confirm("Delete “"+it.title+"”?")){try{await col.doc(it.id).delete()}catch(e){fail(e)}}}]].forEach(([l,f])=>{const b=el("button",null,l);b.onclick=f;a.append(b)});
   sd.append(a);c.append(el("div","grip","⋮⋮"));
  }
  c.append(th,m);if(admin)c.append(sd);
  if(admin){
   c.ondragstart=e=>{dragFrom=i;c.classList.add("drag");e.dataTransfer.effectAllowed="move"};
   c.ondragend=()=>{c.classList.remove("drag");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))};
   c.ondragover=e=>{e.preventDefault();c.classList.add("over")};
   c.ondragleave=()=>c.classList.remove("over");
   c.ondrop=e=>{e.preventDefault();if(dragFrom!=null)move(dragFrom,i);dragFrom=null};
  }
  L.append(c);
 });
 if(!shown)L.append(el("div","empty",items.length?"Nothing found":(admin?"The list is empty. Add the first achievement.":"No achievements yet.")));
 updateTier();
}

col.orderBy("order").onSnapshot(snap=>{
 if(dragFrom!=null)return;
 items=snap.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render();
},err=>{$("list").innerHTML="";$("list").append(el("div","empty","Could not load the list. Check the Firestore rules."));console.error(err)});

auth.onAuthStateChanged(u=>{admin=!!u;$("lock").classList.toggle("on",admin);$("lock").title=admin?"Signed in as "+u.email+" (click to sign out)":"Owner sign in";render()});
$("lock").onclick=()=>{if(admin){if(confirm("Sign out?"))auth.signOut()}else{$("lErr").textContent="";$("login").showModal()}};
$("lCancel").onclick=()=>$("login").close();
$("lf").onsubmit=async e=>{e.preventDefault();$("lErr").textContent="";
 try{await auth.signInWithEmailAndPassword($("lEmail").value.trim(),$("lPass").value);$("lPass").value="";$("login").close()}
 catch(x){$("lErr").textContent="Wrong email or password."}};

function drawPick(){const b=$("fTags");b.innerHTML="";TAGS.forEach(t=>{const x=el("button","tg"+(selTags.has(t)?" on":""),t);x.type="button";x.onclick=()=>{selTags.has(t)?selTags.delete(t):selTags.add(t);drawPick()};b.append(x)})}
function openDlg(it){
 editing=it||null;imgData=null;$("fImg").value="";
 $("dt").textContent=it?"Edit achievement":"New achievement";
 $("fTitle").value=it?it.title||"":"";$("fGame").value=it?it.game||"":"";$("fVer").value=it?it.ver||"":"";$("fDate").value=it?it.date||"":"";
 selTags=new Set(it?it.tags||[]:[]);drawPick();$("dlg").showModal();
}
$("fImg").onchange=e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const w=480,h=Math.round(im.height*w/im.width),cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);imgData=cv.toDataURL("image/jpeg",.7)};im.src=r.result};
 r.readAsDataURL(f);
};
$("save").onclick=async()=>{
 const title=$("fTitle").value.trim();if(!title){$("fTitle").focus();return}
 const d={title,game:$("fGame").value.trim(),ver:$("fVer").value.trim(),date:$("fDate").value,tags:TAGS.filter(t=>selTags.has(t))};
 if(imgData)d.img=imgData;
 try{
  if(editing)await col.doc(editing.id).update(d);
  else await col.add({img:"",...d,order:items.length});
  $("dlg").close();
 }catch(e){fail(e)}
};
$("cancel").onclick=()=>$("dlg").close();
$("add").onclick=()=>openDlg(null);
$("q").oninput=render;
</script>
</body>
</html>
